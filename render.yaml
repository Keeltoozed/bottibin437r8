services:
  - type: web
    name: binance-groq-trader
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -u -m streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_SECRET
        sync: false
      - key: PAPER_TRADING
        value: "true"
      - key: INITIAL_BALANCE
        value: "20.0"
      - key: LEVERAGE
        value: "12"
      - key: RISK_PER_TRADE_PCT
        value: "0.025"
      - key: TRADE_AMOUNT_USDT
        value: "4.5"
      - key: MAX_POSITIONS
        value: "2"

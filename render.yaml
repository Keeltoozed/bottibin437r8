services:
  - type: web
    name: binance-groq-trader
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install --upgrade pip && pip install --prefer-binary -r requirements.txt
    startCommand: python3 -u -m streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_SECRET
        sync: false
      - key: PAPER_TRADING
        value: "true"
      - key: INITIAL_BALANCE
        value: "20.0"
      - key: LEVERAGE
        value: "15"
      - key: RISK_PER_TRADE_PCT
        value: "0.030"
      - key: TRADE_AMOUNT_USDT
        value: "4.0"
      - key: MAX_POSITIONS
        value: "2"
      - key: MIN_24H_VOLUME_USDT
        value: "3000000"
      - key: SCAN_TICKERS_LIMIT
        value: "180"
